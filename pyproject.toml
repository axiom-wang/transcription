[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-audio-notes"
version = "1.0.0"
description = "Offline Qwen3-ASR transcription and faithful Markdown notes for Apple Silicon"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper==1.2.1",
    # PyAV 19 removed metadata_errors, still used by faster-whisper 1.2.1.
    "av>=16,<17",
    "opencc>=1.1.9,<2",
    "mlx-qwen3-asr==0.4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
audio-notes = "audio_notes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
